<style>
    .arrowText {
        font: 8px sans-serif;
     }
	 .pointCoordinateText {
        font: 5px sans-serif;
        fill: #d79b00;
	 }
	 .pixelCoordinateText {
        font: 8px sans-serif;
        fill: white;
		stroke: black;
		stroke-width: 1px;
		paint-order: stroke;
	 }
     .pixelShapeIdText {
